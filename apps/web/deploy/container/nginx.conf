map $http_accept_language $monox_accept_language_entry {
  default /index.html;
  ~*^(?:(?!\s*(?:en|he))[^,]+,)*\s*he /index.he.html;
}
map $arg_lang $monox_entry {
  default $monox_accept_language_entry;
  ~*^en$ /index.html;
  ~*^he$ /index.he.html;
}
map $monox_entry $monox_selected_language {
  default en;
  /index.he.html he;
}
map $uri $monox_content_language {
  default "";
  / $monox_selected_language;
  /index.html $monox_selected_language;
  /index.he.html he;
}
map $monox_content_language $monox_vary_language {
  default Accept-Language;
  "" "";
}
map $uri $monox_cache_control {
  default "";
  /deployment.json "no-store";
}
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header Cache-Control $monox_cache_control always;
  add_header Content-Language $monox_content_language always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'sha256-j5+huJAo2bEyExTIsvCL8uNR05Fe+DupuuQrek0PIb4='; style-src 'self'; img-src 'self' data:" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Vary $monox_vary_language always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  location = /healthz {
    default_type application/json;
    return 200 '{"status":"ok"}';
  }
  location = /deployment.json {
    try_files $uri =404;
  }
  location = / { try_files $monox_entry =404; }
  location = /index.html { try_files $monox_entry =404; }
  location / { try_files $uri $uri/ =404; }
}
