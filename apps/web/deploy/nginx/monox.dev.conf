map $http_accept_language $monox_accept_language_entry {
  default /index.html;
  ~*^(?:(?!\s*(?:en|he))[^,]+,)*\s*he /index.he.html;
}

map $arg_lang $monox_entry {
  default $monox_accept_language_entry;
  ~*^en$ /index.html;
  ~*^he$ /index.he.html;
}

map $monox_entry $monox_selected_language {
  default en;
  /index.he.html he;
}

map $uri $monox_content_language {
  default "";
  / $monox_selected_language;
  /index.html $monox_selected_language;
  /index.he.html he;
}

map $monox_content_language $monox_vary_language {
  default Accept-Language;
  "" "";
}

server {
  listen 80;
  listen [::]:80;
  server_name monox.dev www.monox.dev;
  root /home/monox/htdocs/monox.dev;

  location ^~ /.well-known/acme-challenge/ {
    auth_basic off;
    allow all;
  }

  location / {
    return 301 https://monox.dev$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.monox.dev;

  ssl_certificate_key /etc/nginx/ssl-certificates/monox.dev.key;
  ssl_certificate /etc/nginx/ssl-certificates/monox.dev.crt;

  return 301 https://monox.dev$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name monox.dev;
  root /home/monox/htdocs/monox.dev;

  ssl_certificate_key /etc/nginx/ssl-certificates/monox.dev.key;
  ssl_certificate /etc/nginx/ssl-certificates/monox.dev.crt;

  access_log /home/monox/logs/nginx/access.log main;
  error_log /home/monox/logs/nginx/error.log;

  add_header Content-Language $monox_content_language always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'sha256-j5+huJAo2bEyExTIsvCL8uNR05Fe+DupuuQrek0PIb4='; style-src 'self'; img-src 'self' data:" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Vary $monox_vary_language always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  index index.html;

  location ^~ /.well-known/acme-challenge/ {
    auth_basic off;
    allow all;
  }

  location = /healthz {
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  location = / {
    try_files $monox_entry =404;
  }

  location = /index.html {
    try_files $monox_entry =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
