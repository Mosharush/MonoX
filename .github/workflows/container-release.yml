name: Publish containers

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer image tag without a leading v, for example 0.1.0
        required: true
        type: string
      service:
        description: Service image to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - api
          - web

permissions:
  contents: read

concurrency:
  group: publish-containers-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      owner: ${{ steps.release.outputs.owner }}
      services: ${{ steps.release.outputs.services }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate source, version, and services
        id: release
        shell: bash
        env:
          REQUESTED_SERVICE: ${{ inputs.service }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Container releases must be dispatched from main." >&2
            exit 1
          fi

          if [[ ! "${REQUESTED_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Version must be a SemVer-compatible container tag without a leading v or build metadata." >&2
            exit 1
          fi

          case "${REQUESTED_SERVICE}" in
            all) services='["api","web"]' ;;
            api) services='["api"]' ;;
            web) services='["web"]' ;;
            *) echo "Unsupported service selection." >&2; exit 1 ;;
          esac

          test -f infra/docker/Dockerfile.node
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          printf 'owner=%s\n' "${owner}" >> "${GITHUB_OUTPUT}"
          printf 'services=%s\n' "${services}" >> "${GITHUB_OUTPUT}"

  publish:
    name: Publish ${{ matrix.service }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: container-release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.validate.outputs.services) }}
    env:
      IMAGE_NAME: ghcr.io/${{ needs.validate.outputs.owner }}/monox-${{ matrix.service }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Sign in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to replace a released tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "${IMAGE_NAME}:${RELEASE_VERSION} already exists and will not be replaced." >&2
            exit 1
          fi

      - name: Prepare image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=MonoX ${{ matrix.service }}
            org.opencontainers.image.description=Synthetic MonoX ${{ matrix.service }} example
            org.opencontainers.image.licenses=MIT

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/docker/Dockerfile.node
          build-args: |
            MONOX_WORKSPACE=@monox/${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          sbom: true
          provenance: mode=max

      - name: Record GitHub build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify published image index
        shell: bash
        run: docker buildx imagetools inspect "${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
