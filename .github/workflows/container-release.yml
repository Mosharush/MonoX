name: Publish containers

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer image tag without a leading v, for example 0.1.0
        required: true
        type: string
      service:
        description: Service image to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - api
          - web

permissions:
  contents: read

concurrency:
  group: publish-containers-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      owner: ${{ steps.release.outputs.owner }}
      services: ${{ steps.release.outputs.services }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate source, version, and services
        id: release
        shell: bash
        env:
          REQUESTED_SERVICE: ${{ inputs.service }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Container releases must be dispatched from main." >&2
            exit 1
          fi

          if [[ ! "${REQUESTED_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Version must be a SemVer-compatible container tag without a leading v or build metadata." >&2
            exit 1
          fi

          case "${REQUESTED_SERVICE}" in
            all) services='["api","web"]' ;;
            api) services='["api"]' ;;
            web) services='["web"]' ;;
            *) echo "Unsupported service selection." >&2; exit 1 ;;
          esac

          test -f infra/docker/Dockerfile.node
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          printf 'owner=%s\n' "${owner}" >> "${GITHUB_OUTPUT}"
          printf 'services=%s\n' "${services}" >> "${GITHUB_OUTPUT}"

  publish:
    name: Publish ${{ matrix.service }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: container-release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.validate.outputs.services) }}
    env:
      IMAGE_NAME: ghcr.io/${{ needs.validate.outputs.owner }}/monox-${{ matrix.service }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to replace a released tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "${IMAGE_NAME}:${RELEASE_VERSION} already exists and will not be replaced." >&2
            exit 1
          fi

      - name: Prepare image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=MonoX ${{ matrix.service }}
            org.opencontainers.image.description=Synthetic MonoX ${{ matrix.service }} example
            org.opencontainers.image.licenses=MIT

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile.node
          build-args: |
            MONOX_WORKSPACE=@monox/${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          sbom: true
          provenance: mode=max

      - name: Record GitHub build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify published image index
        shell: bash
        run: docker buildx imagetools inspect "${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
