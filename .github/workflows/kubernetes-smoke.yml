name: Kubernetes runtime smoke

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubernetes-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
  KIND_VERSION: v0.31.0
  KIND_LINUX_AMD64_SHA256: eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa
  KUBECTL_VERSION: v1.35.0
  KUBECTL_LINUX_AMD64_SHA256: a2e984a18a0c063279d692533031c1eff93a262afcc0afdc517375432d060989
  MONOX_KIND_NODE_IMAGE: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f

jobs:
  runtime-smoke:
    name: Build, apply, roll out, and probe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install pinned kind and kubectl clients
        shell: bash
        run: |
          set -euo pipefail
          tool_directory="${RUNNER_TEMP}/monox-bin"
          mkdir -p "${tool_directory}"

          curl --fail --location --retry 3 --show-error \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64" \
            --output "${tool_directory}/kind"
          echo "${KIND_LINUX_AMD64_SHA256}  ${tool_directory}/kind" | sha256sum --check

          curl --fail --location --retry 3 --show-error \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
            --output "${tool_directory}/kubectl"
          echo "${KUBECTL_LINUX_AMD64_SHA256}  ${tool_directory}/kubectl" | sha256sum --check

          chmod 0755 "${tool_directory}/kind" "${tool_directory}/kubectl"
          echo "${tool_directory}" >>"${GITHUB_PATH}"

      - name: Install pinned Corepack
        run: npm install --global corepack@0.35.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies immutably
        run: yarn install --immutable

      - name: Run isolated Kubernetes runtime smoke
        env:
          MONOX_KIND_CLUSTER_NAME: monox-${{ github.run_id }}-${{ github.run_attempt }}
        run: scripts/kubernetes-runtime-smoke.sh
