name: Publish create-monox

on:
  push:
    tags:
      - create-monox-v*

permissions:
  contents: read

concurrency:
  group: publish-create-monox-${{ github.ref_name }}
  cancel-in-progress: false

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
  NPM_CLI_VERSION: 12.0.1

jobs:
  publish:
    name: Publish create-monox to npm
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: npm
    outputs:
      package_version: ${{ steps.release.outputs.package_version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate package and release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          package_name="$(node --input-type=module -e "import data from './packages/create-monox/package.json' with { type: 'json' }; process.stdout.write(data.name)")"
          package_version="$(node --input-type=module -e "import data from './packages/create-monox/package.json' with { type: 'json' }; process.stdout.write(data.version)")"
          package_private="$(node --input-type=module -e "import data from './packages/create-monox/package.json' with { type: 'json' }; process.stdout.write(String(data.private === true))")"
          package_license="$(node --input-type=module -e "import data from './packages/create-monox/package.json' with { type: 'json' }; process.stdout.write(data.license ?? '')")"
          package_repository="$(node --input-type=module -e "import data from './packages/create-monox/package.json' with { type: 'json' }; const repository = typeof data.repository === 'string' ? data.repository : data.repository?.url ?? ''; process.stdout.write(repository)")"
          expected_tag="create-monox-v${package_version}"
          expected_repository="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          source_sha="$(git rev-parse HEAD)"
          main_sha="$(git rev-parse refs/remotes/origin/main)"

          if [[ "${package_name}" != "create-monox" ]]; then
            echo "Expected the package name create-monox." >&2
            exit 1
          fi

          if [[ "${package_private}" == "true" ]]; then
            echo "create-monox must be reviewed and marked publishable before release." >&2
            exit 1
          fi

          if [[ "${package_license}" != "MIT" || ! -f packages/create-monox/LICENSE ]]; then
            echo "create-monox must declare MIT and include its LICENSE file." >&2
            exit 1
          fi

          case "${package_repository}" in
            "${expected_repository}"|"${expected_repository}.git"|"git+${expected_repository}.git") ;;
            *)
              echo "Package repository must match ${expected_repository} for npm provenance." >&2
              exit 1
              ;;
          esac

          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag must exactly match ${expected_tag}." >&2
            exit 1
          fi

          if [[ "${source_sha}" != "${main_sha}" ]]; then
            echo "Release tag must point to the current main commit." >&2
            exit 1
          fi

          if [[ ! "${package_version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Package version is not an accepted SemVer release version." >&2
            exit 1
          fi

          echo "package_version=${package_version}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Install pinned Corepack
        run: npm install --global corepack@0.35.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies immutably
        run: yarn install --immutable

      - name: Verify the pinned trusted-publishing npm client
        run: npx --yes "npm@${NPM_CLI_VERSION}" --version

      - name: Run the complete repository gate
        run: yarn check

      - name: Reject high-severity dependency findings
        run: yarn npm audit --all --recursive --severity high

      - name: Inspect package contents
        working-directory: packages/create-monox
        run: npx --yes "npm@${NPM_CLI_VERSION}" pack --dry-run --json --workspaces=false

      - name: Inspect existing registry version
        id: registry
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            registry_cache="$(mktemp -d)"
            registry_error="$(mktemp)"
            if registry_record="$(
              NPM_CONFIG_CACHE="${registry_cache}" \
                npx --yes "npm@${NPM_CLI_VERSION}" view \
                  "create-monox@${PACKAGE_VERSION}" version gitHead \
                  --json \
                  --workspaces=false 2>"${registry_error}"
            )"; then
              registry_version="$(
                REGISTRY_RECORD="${registry_record}" node --input-type=module -e \
                  "const raw = JSON.parse(process.env.REGISTRY_RECORD); const data = Array.isArray(raw) ? raw[0] : raw; process.stdout.write(data?.version ?? '')"
              )"
              registry_git_head="$(
                REGISTRY_RECORD="${registry_record}" node --input-type=module -e \
                  "const raw = JSON.parse(process.env.REGISTRY_RECORD); const data = Array.isArray(raw) ? raw[0] : raw; process.stdout.write(data?.gitHead ?? '')"
              )"
              if [[ "${registry_version}" != "${PACKAGE_VERSION}" || "${registry_git_head}" != "${SOURCE_SHA}" ]]; then
                echo "Existing registry release does not match the tagged source." >&2
                exit 1
              fi
              echo "exists=true" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            if ! grep -Eq 'E404|ETARGET|notarget' "${registry_error}"; then
              cat "${registry_error}" >&2
              echo "Registry state could not be determined safely." >&2
              exit 1
            fi
            if [[ "${attempt}" -lt 3 ]]; then
              sleep 5
            fi
          done

          echo "exists=false" >> "${GITHUB_OUTPUT}"

      - name: Publish with npm trusted publishing
        if: steps.registry.outputs.exists != 'true'
        working-directory: packages/create-monox
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
        run: |
          set -euo pipefail
          if [[ "${PACKAGE_VERSION}" == *-* ]]; then
            distribution_tag="next"
          else
            distribution_tag="latest"
          fi
          npx --yes "npm@${NPM_CLI_VERSION}" publish \
            --access public \
            --provenance \
            --tag "${distribution_tag}" \
            --workspaces=false

  verify:
    name: Verify the public npm release without publishing authority
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/npm-release-verification.yml
    with:
      package_version: ${{ needs.publish.outputs.package_version }}
      release_tag: ${{ github.ref_name }}
      source_sha: ${{ needs.publish.outputs.source_sha }}
