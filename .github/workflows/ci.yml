name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

jobs:
  quality:
    name: Quality and compatibility (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
          - 26
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install pinned Corepack
        run: npm install --global corepack@0.35.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies immutably
        run: yarn install --immutable

      - name: Check formatting
        run: yarn format:check

      - name: Lint repository
        run: yarn lint

      - name: Run tests
        run: yarn test

      - name: Build workspaces
        run: yarn build

      - name: Validate infrastructure
        run: yarn infra:check

      - name: Prepare synthetic Compose credentials
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "${GITHUB_ENV}"
          import { randomBytes } from 'node:crypto';
          console.log(`POSTGRES_PASSWORD=${randomBytes(24).toString('base64url')}`);
          console.log(`REDIS_PASSWORD=${randomBytes(24).toString('base64url')}`);
          NODE

      - name: Validate local Compose model
        run: docker compose -f infra/local/docker-compose.yml config --quiet

  node-26-consumer-smoke:
    name: Node 26 consumer (${{ matrix.package-manager }}) without bundled Corepack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package-manager:
          - yarn
          - npm
          - pnpm
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 26
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Generate and install without a global Corepack binary
        shell: bash
        run: |
          set -euo pipefail
          shim_directory="${RUNNER_TEMP}/no-corepack"
          project_directory="${RUNNER_TEMP}/consumer-${{ matrix.package-manager }}"
          mkdir -p "${shim_directory}"
          printf '#!/usr/bin/env bash\nexit 127\n' >"${shim_directory}/corepack"
          chmod 0755 "${shim_directory}/corepack"

          if PATH="${shim_directory}:${PATH}" corepack --version; then
            echo "The consumer smoke must not use a global Corepack binary." >&2
            exit 1
          fi

          PATH="${shim_directory}:${PATH}" node packages/create-monox/src/cli.mjs consumer-project \
            --directory "${project_directory}" \
            --package-manager "${{ matrix.package-manager }}" \
            --infra none \
            --yes \
            --no-git

          (
            cd "${project_directory}"
            case "${{ matrix.package-manager }}" in
              yarn)
                test -f yarn.lock
                PATH="${shim_directory}:${PATH}" npx --yes corepack@0.35.0 yarn test
                ;;
              npm)
                test -f package-lock.json
                PATH="${shim_directory}:${PATH}" npx --yes npm@10.9.2 test
                ;;
              pnpm)
                test -f pnpm-lock.yaml
                PATH="${shim_directory}:${PATH}" npx --yes corepack@0.35.0 pnpm test
                ;;
            esac
          )

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install pinned Corepack
        run: npm install --global corepack@0.35.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies immutably
        run: yarn install --immutable

      - name: Audit all workspace dependencies
        run: yarn npm audit --all --recursive --severity high

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  source-sbom:
    name: Source SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: monox-source.spdx.json
          output-file: monox-source.spdx.json
          upload-release-assets: false
