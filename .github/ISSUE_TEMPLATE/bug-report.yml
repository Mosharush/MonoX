name: Bug report
description: Report a reproducible problem in MonoX or create-monox.
title: '[Bug]: '
labels:
  - bug
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve MonoX. Do not include secrets or private data.
        Security vulnerabilities belong in GitHub's private vulnerability reporting flow, not a public issue.

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the package version, image tag, or commit SHA.
      placeholder: 0.2.0
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - create-monox CLI
        - Workspace discovery
        - Development runner
        - API example
        - Web example
        - Containers or local infrastructure
        - Kubernetes renderer
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain the behavior and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Share the smallest complete sequence that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, architecture, Node.js, Yarn, Docker, and Kubernetes versions when relevant.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Remove tokens, credentials, private URLs, and personal data before pasting output.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I confirm this report does not disclose a security vulnerability or private data.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
