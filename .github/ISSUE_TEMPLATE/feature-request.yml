name: Feature request
description: Propose a focused improvement to MonoX or create-monox.
title: '[Feature]: '
labels:
  - enhancement
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Good proposals start with the user problem and stay within MonoX's generic, synthetic scope.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has this problem, and what can they not do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the smallest useful outcome. API sketches and example commands are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain current workarounds or simpler approaches you considered.

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - create-monox CLI
        - Workspace discovery
        - Development runner
        - API or web examples
        - Containers or local infrastructure
        - Kubernetes renderer
        - Documentation
        - Repository tooling
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and discussions for a similar proposal.
          required: true
        - label: The proposal does not depend on customer code, private infrastructure, or private data.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
